name: Update Studio download badge
on:
  release:
    types: [published]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-download-count
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Check installer-only counting
        run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Publish installer download count
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/update_download_count.py
